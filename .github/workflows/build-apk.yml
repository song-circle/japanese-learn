name: Build Android APK

on:
  push:
    branches: [ main, master ]
    # PC 앱(desktop/)만 바뀌었을 때는 APK를 다시 만들지 않는다
    paths-ignore:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 단계의 if:에서는 secrets를 직접 쓸 수 없어 환경 변수로 넘긴다
    env:
      HAS_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # 기본값에 있는 'tools' 패키지는 지금 SDK 저장소에 없어서 설치가 실패한다
        packages: 'platform-tools'
    
    - name: Install dependencies
      run: npm ci || npm install
    
    - name: Build web app
      run: npm run build
      env:
        # 앱 안 버전 번호(자동 업데이트 비교용). APK 1.0.<번호>와 같다
        WEB_VERSION: ${{ github.run_number }}

    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Make gradlew executable
      run: chmod +x android/gradlew
    
    # 빌드 서버는 매번 새 디버그 서명 키를 만들어서, 서명이 달라 휴대폰에서 업데이트 설치가 거부됐다.
    # 고정 키(DEBUG_KEYSTORE_BASE64)를 디버그 서명 키 자리에 둬서 늘 같은 서명으로 만든다.
    - name: Use fixed debug signing key
      if: env.HAS_DEBUG_KEYSTORE == 'true'
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

    - name: Clean previous build
      run: |
        cd android
        ./gradlew clean --no-daemon
    
    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace \
          -PappVersionCode=${{ github.run_number }} \
          -PappVersionName=1.0.${{ github.run_number }}
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: japanese-learn-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release with APK
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Japanese Learn v1.0.${{ github.run_number }}
        body: |
          ## 📱 일본어 학습 APK
          
          아래 `app-debug.apk` 파일을 다운로드하여 설치하세요.
          
          ### 설치 방법
          1. APK 파일 다운로드
          2. 설정 → 보안 → 출처를 알 수 없는 앱 설치 허용
          3. APK 파일 실행하여 설치
        files: android/app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 자동 업데이트용 고정 주소: web-latest 릴리스를 지우고 이번 화면 파일(web-<번호>.zip)과 version.json으로 다시 만든다.
    # 앱은 .../releases/download/web-latest/version.json을 보고 새 번호면 zip을 받아 바꾼다(APK 재설치 없이).
    # minApk: 이 번호보다 오래된 APK는 업데이트하지 않고 APK를 새로 받으라고 안내한다.
    #   안드로이드 쪽(권한·플러그인·capacitor.config)을 바꾼 커밋에서는 android/min-apk.txt를 그 빌드 번호로 올린다.
    - name: Publish web update (web-latest)
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        N=${{ github.run_number }}
        (cd dist && zip -qr ../web-$N.zip .)
        MIN=$(tr -dc '0-9' < android/min-apk.txt)
        echo "{\"version\": $N, \"minApk\": ${MIN:-0}, \"url\": \"https://github.com/${{ github.repository }}/releases/download/web-latest/web-$N.zip\"}" > version.json
        cat version.json
        gh release delete web-latest --yes --cleanup-tag || true
        gh release create web-latest web-$N.zip version.json \
          --title "앱 자동 업데이트용 (최신 v1.0.$N)" \
          --notes "휴대폰 앱이 자동 업데이트에 쓰는 파일입니다. 처음 설치는 v1.0.으로 시작하는 릴리스의 APK를 받으세요." \
          --latest=false --target "${{ github.sha }}"
