name: Build PC App

# PC 듣기 연습 앱(desktop/)을 Windows 설치 파일로 만들어 릴리스에 올린다.
# 문장 데이터·복습 로직·음성이 바뀌어도 다시 만든다(PC 앱이 휴대폰 앱의 것을 그대로 쓰므로).
on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'src/data/sentences.js'
      - 'src/utils/listenSrs.js'
      - 'src/utils/distractors.js'
      - 'src/utils/cloze.js'
      - 'src/utils/levels.js'
      - 'src/utils/realSound.js'
      - 'src/utils/realVariant.js'
      - 'src/utils/hangulPron.js'
      - 'src/data/variants.js'
      - 'public/audio/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install
      run: npm ci

    - name: Set version
      run: npm version 1.0.${{ github.run_number }} --no-git-tag-version

    - name: Build installer
      run: npm run dist

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: desktop-v1.0.${{ github.run_number }}
        name: PC 듣기 연습 v1.0.${{ github.run_number }}
        body: |
          ## 🖥️ PC 듣기 연습 (Windows)

          아래 `japanese-listen-setup-*.exe`를 받아 실행하면 설치되고 바로 켜집니다.
          - `Ctrl+Alt+J` (또는 트레이 아이콘 클릭): 일본어 음성 + 오른쪽 아래 보기 4개
          - 1~4 고르기 · R 다시 듣기 · S 느리게 · H 힌트(하나씩, 각 -1점) · 0 포기 · Space 다음 · Esc 닫기
          - 틀리면 정답을 바로 알려 주지 않아요. 다시 듣고 맞힐 때까지 고르세요(채점은 첫 번째 답으로)
          - 서명되지 않은 프로그램이라 처음 실행할 때 'Windows의 PC 보호' 창이 뜨면 '추가 정보' → '실행'
        files: desktop/release/japanese-listen-setup-*.exe
        prerelease: false
        # 휴대폰 APK 릴리스가 계속 Latest로 남게
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 자동 업데이트용 고정 주소: desktop-latest 릴리스를 지우고 이번 파일(설치 파일·latest.yml·blockmap)로 다시 만든다.
    # 설치된 앱은 .../releases/download/desktop-latest/latest.yml을 보고 새 버전을 받는다.
    - name: Update auto-update feed (desktop-latest)
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete desktop-latest --yes --cleanup-tag || true
        gh release create desktop-latest \
          release/latest.yml release/japanese-listen-setup-*.exe release/japanese-listen-setup-*.exe.blockmap \
          --title "PC 듣기 연습 자동 업데이트용 (최신 v1.0.${{ github.run_number }})" \
          --notes "PC 앱이 자동 업데이트에 쓰는 파일입니다. 처음 설치는 desktop-v로 시작하는 릴리스에서 받으세요." \
          --latest=false --target "${{ github.sha }}"
